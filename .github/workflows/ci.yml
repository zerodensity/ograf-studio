name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [stable, main, dev]

permissions:
  contents: read

jobs:
  pr-target:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request target
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$BASE_BRANCH" = dev ]; then exit 0; fi
          if [ "$BASE_BRANCH" = stable ] && [ "$HEAD_BRANCH" = dev ] && [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then exit 0; fi
          echo '::error::Please target dev. Only promotions from the repository dev branch should target stable.'
          exit 1
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
